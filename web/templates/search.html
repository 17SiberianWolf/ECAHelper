{% extends "base.html" %}
{% set active = 'search' %}
{% block content %}
<section class="panel">
  <h2>综合检索</h2>
  <div class="row">
    <div class="field">
      <label>报告月份 起</label>
      <div id="sStartBox" class="ym"></div>
      <input type="hidden" id="sStart" value="{{ month_lo or '' }}">
      <input type="hidden" id="sLo" value="{{ month_lo or '' }}">
    </div>
    <div class="field">
      <label>报告月份 止</label>
      <div id="sEndBox" class="ym"></div>
      <input type="hidden" id="sEnd" value="{{ month_hi or '' }}">
      <input type="hidden" id="sHi" value="{{ month_hi or '' }}">
    </div>
    <div class="field">
      <label>组织（可搜索）</label>
      <div id="orgSelBox" class="ss"></div>
      <input type="hidden" id="orgSel">
      <label class="chk-inline"><input type="checkbox" id="incSub" checked> 含下级</label>
    </div>
    <div class="field">
      <label>成本中心（可搜索）</label>
      <div id="ccSelBox" class="ss"></div>
      <input type="hidden" id="ccSel">
    </div>
    <div class="field">
      <label>任务类别（可搜索/可输入）</label>
      <div id="taskSelBox" class="ss"></div>
      <input type="hidden" id="taskSel">
    </div>
    <div class="field">
      <label>人员（可搜索）</label>
      <div id="personSelBox" class="ss"></div>
      <input type="hidden" id="personSel">
    </div>
    <div class="field">
      <label>项目（可搜索/按父项目号）</label>
      <div id="projectSelBox" class="ss"></div>
      <input type="hidden" id="projectSel">
    </div>
    <div class="field">
      <label><input type="checkbox" id="incEmpty"> 含空项目号行</label>
    </div>
  </div>
  <p class="hint">ⓘ 下拉项后的 <b>N 行</b> = 在当前其他条件下该取值能命中的行数；<b>零行项不出现</b>，因此不会选到空组合。「含下级」默认开启：选 <code>EA</code> 即整个 EA 部门（含 EAR/EAI/EAP…）。任务支持关键字过滤与列表外输入（按「包含」匹配）。</p>
  <div class="quick">
    <button data-q="thisyear">今年</button>
    <button data-q="lastyear">去年</button>
    <button data-q="all">全部</button>
    <button data-q="quarter">当前季</button>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="btnQuery">查询</button>
    <button class="secondary" id="btnFacets">刷新候选计数</button>
    <span class="spinner" id="sMsg"></span>
  </div>
</section>

<section class="panel">
  <div class="tabs">
    <button data-tab="res" class="active">三层结果</button>
    <button data-tab="chart">图表</button>
  </div>
  <div id="zeroGuide" class="hidden"></div>
  <div id="result"></div>
  <div id="chartArea" class="hidden">
    <h3>按月趋势</h3>
    <div class="chart-wrap" id="chartTrend"></div>
    <h3>项目 Top N</h3>
    <div class="row" style="margin:6px 0">
      <select id="topnDim">
        <option value="project">按项目</option>
        <option value="person">按人员</option>
        <option value="org">按组织</option>
        <option value="cost_center">按成本中心</option>
      </select>
      <select id="topnN">
        <option>5</option><option selected>10</option><option>20</option><option>50</option>
      </select>
    </div>
    <div class="chart-wrap" id="chartTopn"></div>
  </div>
</section>

<section class="panel">
  <h2>导出</h2>
  <div class="row">
    <div class="field"><label>格式</label>
      <select id="expFmt"><option value="xlsx">Excel</option><option value="csv">CSV</option></select></div>
    <div class="field"><label>语言</label>
      <select id="expLang"><option value="both">中英</option><option value="en">EN</option><option value="zh">中文</option></select></div>
    <button class="secondary" id="btnExport">导出当前查询</button>
  </div>
</section>
{% endblock %}
{% block scripts %}<script>window.ECA.initSearch();</script>{% endblock %}
