{% extends "base.html" %}
{% set active = 'employee' %}
{% block content %}
<section class="panel">
  <h2>员工工时查询</h2>
  <p class="muted">选择资源号，或输入姓名/别名（自动解析）。空项目号工时归入「非项目工时」按任务细分。</p>
  <div class="row">
    <div class="field">
      <label>资源号（可搜索）</label>
      <div id="personIdBox" class="ss"></div>
      <input type="hidden" id="personId">
    </div>
    <div class="field">
      <label>或输入姓名/别名</label>
      <input type="text" id="personQuery" placeholder="如 Li, Bo / WAXI">
    </div>
    <div class="field">
      <label>报告月份 起</label>
      <div id="eStartBox" class="ym"></div>
      <input type="hidden" id="eStart" value="{{ month_lo or '' }}">
      <input type="hidden" id="eLo" value="{{ month_lo or '' }}">
    </div>
    <div class="field">
      <label>报告月份 止</label>
      <div id="eEndBox" class="ym"></div>
      <input type="hidden" id="eEnd" value="{{ month_hi or '' }}">
      <input type="hidden" id="eHi" value="{{ month_hi or '' }}">
    </div>
  </div>
  <p class="hint">ⓘ 空项目号工时归入「非项目工时」，按任务细分；资源号可输入关键字过滤（支持资源号/姓名）。</p>
  <div class="quick">
    <button data-q="thisyear">今年</button>
    <button data-q="lastyear">去年</button>
    <button data-q="all">全部</button>
    <button data-q="quarter">当前季</button>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="btnQuery">查询</button>
    <span class="spinner" id="eMsg"></span>
  </div>
</section>

<section class="panel">
  <div class="tabs">
    <button data-tab="res" class="active">三层结果</button>
    <button data-tab="chart">图表</button>
  </div>
  <div id="result"></div>
  <div id="chartArea" class="hidden">
    <h3>按月趋势</h3>
    <div class="chart-wrap" id="chartTrend"></div>
    <h3>项目 Top N</h3>
    <div class="row" style="margin:6px 0">
      <select id="topnDim">
        <option value="project">按项目</option>
        <option value="person">按人员</option>
        <option value="org">按组织</option>
        <option value="cost_center">按成本中心</option>
      </select>
      <select id="topnN">
        <option>5</option><option selected>10</option><option>20</option><option>50</option>
      </select>
    </div>
    <div class="chart-wrap" id="chartTopn"></div>
  </div>
</section>

<section class="panel">
  <h2>导出</h2>
  <div class="row">
    <div class="field"><label>格式</label>
      <select id="expFmt"><option value="xlsx">Excel</option><option value="csv">CSV</option></select></div>
    <div class="field"><label>语言</label>
      <select id="expLang"><option value="both">中英</option><option value="en">EN</option><option value="zh">中文</option></select></div>
    <button class="secondary" id="btnExport">导出当前查询</button>
  </div>
</section>
{% endblock %}
{% block scripts %}<script>window.ECA.initEmployee();</script>{% endblock %}
