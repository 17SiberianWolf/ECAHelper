{% extends "base.html" %}
{% set active = 'import' %}
{% block content %}
<section class="panel">
  <h2>数据导入</h2>
  <p class="muted">数据目录：<code>{{ origin_dir }}</code></p>
  <p class="muted">勾选下方文件后点击「导入选中」；已导入文件默认跳过（幂等）。
     自动跳过 <code>~$</code> 锁文件与在管项目主数据。</p>
  <div class="row">
    <button id="btnSelectAll" class="secondary">全选</button>
    <button id="btnImportSelected">导入选中</button>
    <button id="btnImport" class="secondary">导入全部</button>
    <span class="muted" id="selCount">已选 0 个文件</span>
    <span class="spinner hidden" id="importSpin"></span>
  </div>
  <div id="importList" class="import-list"></div>
  <div id="importResult" class="layer" style="margin-top:14px"></div>
</section>
{% endblock %}
{% block scripts %}<script>window.ECA.initImport();</script>{% endblock %}
